extensions:
    enabled:
        - HCaptcha\Tests\Codeception\FunctionMockerExtension
modules:
    enabled:
        - WPLoader
    config:
        WPLoader:
            wpRootFolder: '%WP_ROOT_PATH%'
            WPMU_PLUGIN_DIR: '%WP_ROOT_PATH%/_empty_mu_plugins'
            dbName: '%DB_NAME%'
            dbHost: '%DB_HOST%'
            dbUser: '%DB_USER%'
            dbPassword: '%DB_PASSWORD%'
            wpDebug: true
            tablePrefix: '%DB_TABLE_PREFIX%'
            domain: '%WP_URL%'
            plugins:
                - hcaptcha-wordpress-plugin/hcaptcha.php
            activatePlugins:
                - hcaptcha-wordpress-plugin/hcaptcha.php
